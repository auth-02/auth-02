name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: platane/snk@v3
        id: snake-svg
        with:
          github_user_name: auth-02
          svg_out_size: 300
      
      - name: Push generated files to the output branch
        uses: actions/upload-artifact@v3
        with:
          name: generated
          path: dist/
      
      - name: Commit and push
        run: |
          mkdir -p dist
          cp ${{ steps.snake-svg.outputs.svg }} dist/github-contribution-grid-snake.svg || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ || true
          git commit -m "Generate snake contribution graph" || true
          git push origin HEAD:output || git push --set-upstream origin output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
